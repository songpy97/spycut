name: Bug report
description: Report a reproducible problem in SpyCut
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SpyCut. Do not upload private recordings, project sidecars, preview URLs, tokens, or unsanitized diagnostic logs. Use synthetic media whenever possible.
  - type: input
    id: version
    attributes:
      label: SpyCut version
      description: For example, v0.1.5 or a commit SHA.
      placeholder: v0.1.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - Windows 11 x64
        - Windows 10 x64
        - Development environment / other
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Sanitized media characteristics
      description: Include codec, duration, resolution, frame rate, audio streams, bit depth, and approximate size. Do not include private filenames or content.
      placeholder: H.265 Main10 MP4, 1920×1080, 30 fps, AAC stereo, 2h 10m, approximately 8 GB
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of actions.
      placeholder: |
        1. Open a synthetic MP4...
        2. Mark a delete interval...
        3. Start export...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error message or screenshot if useful.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostics
      description: State whether the issue reproduces consistently and whether a sanitized diagnostic log is available. Do not paste private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirmed that this report contains no private recording content, local absolute paths, preview URLs/tokens, or other user data.
          required: true
